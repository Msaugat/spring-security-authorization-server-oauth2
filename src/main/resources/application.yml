server:
  port: 9090

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:postgresql://localhost:5432/sec_test
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

app:
  security:
    issuer: http://localhost:8080
    access-token:
      expiry: 30m
    refresh-token:
      expiry: 7d